<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Day 2 - Practice CSS Styling</h1>
        <nav class="navbar">
            <div class="logo">MySite</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <section>
        <div class="card">
            <img src="columbina.png" class="avatar" alt="Columbina with Ramon the Dawg">
            <div class="info">
                <h3>Columbina</h3>
                <p class="role">Kuutar</p>
            </div>
        </div>
        <hr>
        <div class="stats">
            <div class="stat">
                <p class="number">120</p>
                <p class="label">Posts</p>
            </div>
            <div class="stat">
                <p class="number">45</p>
                <p class="label">Followers</p>
            </div>
            <div class="stat">
                <p class="number">8</p>
                <p class="label">Following</p>
            </div>
        </div>
        <div class="pricing-row">
            <div class="plan">
                <h3>Basic</h3>
                <p class="price">$9</p>
            </div>
            <div class="plan featured">
                <h3>Pro</h3>
                <p class="price">$19</p>
            </div>
            <div class="plan">
                <h3>Premium</h3>
                <p class="price">$29</p>
            </div>
        </div>
    </section>
    <footer>
        Copyright 2026
    </footer>
</body>
</html>
